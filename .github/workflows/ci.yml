# SPDX-License-Identifier: GPL-3.0-or-later
#
# kairos-grid CI — two-gate pipeline.
#
# Gate 1 has two independent jobs, both run on push + PR:
#   build-and-test      — core engine, 3-compiler matrix, Release.
#   build-and-test-surge — Surge XT DSP wrappers, 3-compiler matrix, Release
#                          (separate job: expensive fetch, distinct code path).
#   nomos-topology checked out at current main in both (main-tracking integration).
#
# Gate 2 (sanitize): Clang only, engine + plugin Debug + ASan + UBSan, PR only,
#                    runs only after build-and-test is fully green.
# Gate 3 (tsan):    Linux/Clang only, engine + plugin Debug + TSan, PR only,
#                    runs only after build-and-test is fully green.
#                    TSan is mutually exclusive with ASan; UBSan in gate 2.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: build / ${{ matrix.os }} / ${{ matrix.compiler }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, compiler: gcc-14,     cc: gcc-14,   cxx: g++-14     }
          - { os: ubuntu-24.04, compiler: clang-18,   cc: clang-18, cxx: clang++-18 }
          - { os: macos-15,     compiler: apple-clang, cc: clang,   cxx: clang++    }

    steps:
      - uses: actions/checkout@v4

      - name: Cache CMake FetchContent deps
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: ${{ runner.os }}-${{ matrix.compiler }}-kairos-grid-cmake-deps-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: ${{ runner.os }}-${{ matrix.compiler }}-kairos-grid-cmake-deps-

      - name: Check out nomos-topology @ main
        uses: actions/checkout@v4
        with:
          repository: nomos-studio/nomos-topology
          path: deps/nomos-topology

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y libasound2-dev

      - name: Configure
        env:
          CC:  ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -S . -B build --preset ci \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DNOMOS_TOPOLOGY_SRC_DIR=${{ github.workspace }}/deps/nomos-topology

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  build-and-test-surge:
    name: surge / ${{ matrix.os }} / ${{ matrix.compiler }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, compiler: gcc-14,     cc: gcc-14,   cxx: g++-14     }
          - { os: ubuntu-24.04, compiler: clang-18,   cc: clang-18, cxx: clang++-18 }
          - { os: macos-15,     compiler: apple-clang, cc: clang,   cxx: clang++    }

    steps:
      - uses: actions/checkout@v4

      - name: Cache CMake FetchContent deps (surge)
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: ${{ runner.os }}-${{ matrix.compiler }}-kairos-grid-surge-cmake-deps-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: ${{ runner.os }}-${{ matrix.compiler }}-kairos-grid-surge-cmake-deps-

      - name: Check out nomos-topology @ main
        uses: actions/checkout@v4
        with:
          repository: nomos-studio/nomos-topology
          path: deps/nomos-topology

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y libasound2-dev

      - name: Configure
        env:
          CC:  ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -S . -B build --preset ci-surge \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DNOMOS_TOPOLOGY_SRC_DIR=${{ github.workspace }}/deps/nomos-topology

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  sanitize:
    name: sanitize / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: build-and-test
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, cc: clang-18, cxx: clang++-18 }
          - { os: macos-15,     cc: clang,    cxx: clang++    }

    steps:
      - uses: actions/checkout@v4

      - name: Cache CMake FetchContent deps (sanitize)
        uses: actions/cache@v4
        with:
          path: build-san/_deps
          key: ${{ runner.os }}-clang-kairos-grid-san-cmake-deps-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: ${{ runner.os }}-clang-kairos-grid-san-cmake-deps-

      - name: Check out nomos-topology @ main
        uses: actions/checkout@v4
        with:
          repository: nomos-studio/nomos-topology
          path: deps/nomos-topology

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y libasound2-dev

      - name: Configure
        env:
          CC:  ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -S . -B build-san --preset sanitize \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DNOMOS_TOPOLOGY_SRC_DIR=${{ github.workspace }}/deps/nomos-topology

      - name: Build
        run: cmake --build build-san --parallel

      - name: Test
        run: ctest --test-dir build-san --output-on-failure

  tsan:
    name: tsan / ubuntu-24.04
    runs-on: ubuntu-24.04
    needs: build-and-test
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - name: Cache CMake FetchContent deps (tsan)
        uses: actions/cache@v4
        with:
          path: build-tsan/_deps
          key: ubuntu-clang-kairos-grid-tsan-cmake-deps-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: ubuntu-clang-kairos-grid-tsan-cmake-deps-

      - name: Check out nomos-topology @ main
        uses: actions/checkout@v4
        with:
          repository: nomos-studio/nomos-topology
          path: deps/nomos-topology

      - name: Install system deps
        run: sudo apt-get update -qq && sudo apt-get install -y libasound2-dev

      - name: Configure
        env:
          CC:  clang-18
          CXX: clang++-18
        run: |
          cmake -S . -B build-tsan --preset tsan \
            -DCMAKE_C_COMPILER=clang-18 \
            -DCMAKE_CXX_COMPILER=clang++-18 \
            -DNOMOS_TOPOLOGY_SRC_DIR=${{ github.workspace }}/deps/nomos-topology

      - name: Build
        run: cmake --build build-tsan --parallel

      - name: Test
        run: ctest --test-dir build-tsan --output-on-failure

  format-check:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format-18
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-18 main" \
            | sudo tee /etc/apt/sources.list.d/llvm-18.list
          sudo apt-get update -qq
          sudo apt-get install -y clang-format-18

      - name: Check formatting
        run: |
          find include src tests -name '*.cpp' -o -name '*.hpp' | \
            xargs clang-format-18 --dry-run --Werror
